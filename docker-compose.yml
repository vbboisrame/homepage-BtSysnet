services:

  # ── Base de données MariaDB ──
  mariadb:
    image: mariadb:11.4
    container_name: proxima-mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - proxima-net

  # ── Backend Express ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxima-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:     ${DB_HOST}
      DB_PORT:     ${DB_PORT}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
      PORT:        ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    networks:
      - proxima-net

  # ── Frontend Angular (prod) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxima-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - proxima-net

volumes:
  mariadb_data:

networks:
  proxima-net:
    driver: bridge
